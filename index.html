<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="槓片計算">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>槓片計算</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d0d0f;color:#fff;font-family:-apple-system,"PingFang TC",sans-serif;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px)}
h1{font-size:22px;margin:0 0 14px;font-weight:800}
.tog{display:flex;background:#1c1c20;border-radius:16px;padding:4px;margin-bottom:16px}
.tog button{flex:1;border:0;background:none;color:#aaa;font-size:19px;font-weight:700;padding:14px;border-radius:12px}
.tog button.on{background:#ff7a1a;color:#fff}
.in{display:flex;align-items:center;gap:10px}
.in button{width:64px;height:72px;border:0;border-radius:16px;background:#26262b;color:#fff;font-size:34px;font-weight:700}
.in input{flex:1;min-width:0;height:72px;border:2px solid #333;border-radius:16px;background:#16161a;color:#fff;font-size:40px;font-weight:800;text-align:center}
.hint{color:#888;font-size:14px;text-align:center;margin:8px 0 18px}
.card{background:#16161a;border-radius:20px;padding:18px}
.st{font-size:18px;font-weight:700;margin-bottom:10px}.bad{color:#ff5252}
svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 14px;border-radius:12px;font-weight:800;font-size:18px}
.note{margin-top:12px;color:#aaa;font-size:15px;line-height:1.5}
.near button{margin:6px 6px 0 0;border:0;border-radius:12px;background:#26262b;color:#fff;font-size:17px;padding:12px 16px;font-weight:700}
</style></head><body>
<h1>🧮 槓片計算</h1>
<div class="tog"><button id="bb" class="on">🏋️ 槓鈴</button><button id="db">💪 啞鈴</button></div>
<div class="in"><button id="mn">−</button><input id="w" inputmode="decimal" value="42"><button id="pl">＋</button></div>
<div class="hint" id="hint"></div><div class="card" id="out"></div>
<script src="data.js"></script><script>
const P=[[1,'#8d6e63','1',.55],[1.25,'#9e9e9e','1.25',.6],[1.5,'#43a047','1.5',.68],[2,'#fdd835','2',.78],[2.5,'#1e88e5','2.5',.86],[5,'#e53935','5',1]];
let eq='槓鈴';const $=id=>document.getElementById(id),W=$('w');
const rows=()=>ROWS.filter(r=>r.e===eq);
function plates(c){let a=[];for(let i=5;i>=0;i--)for(let k=0;k<c[i];k++)a.push(P[i]);return a}
function svg(c){const a=plates(c);let x=40,s='';const H=150;
 a.forEach(p=>{const w=p[0]>=2.5?30:p[0]>=1.5?24:20,h=H*p[3];
 s+=`<rect x="${x}" y="${(170-h)/2}" width="${w}" height="${h}" rx="4" fill="${p[1]}"/><text x="${x+w/2}" y="${(170-h)/2+h+16}" fill="#ddd" font-size="12" font-weight="700" text-anchor="middle">${p[2]}</text>`;x+=w+3});
 const L=Math.max(x+40,300);
 return `<svg viewBox="0 0 ${L} 190"><rect x="0" y="72" width="34" height="26" fill="#777"/><rect x="34" y="60" width="6" height="50" fill="#999"/><rect x="40" y="76" width="${L-40}" height="18" rx="3" fill="#bbb"/>${s}</svg>`}
function chips(c){return plates(c).map(p=>`<span class="chip" style="background:${p[1]};color:${p[0]==2?'#000':'#fff'}">${p[2]}</span>`).join('')||'<span class="note">不用掛片（空槓）</span>'}
function sum(c){return c.reduce((s,n,i)=>s+n*P[i][0],0)}
function render(){const v=parseFloat(W.value);$('hint').textContent=eq==='槓鈴'?'輸入總重（含 12 kg 空槓）':'輸入單支啞鈴重量（含 0.6 kg 握把）';
 if(isNaN(v)){$('out').innerHTML='<div class="st">請輸入重量</div>';return}
 const R=rows(),r=R.find(r=>Math.abs(r.t-v)<1e-6);
 if(!r){const lo=R.filter(r=>r.t<v).pop(),hi=R.find(r=>r.t>v);
  $('out').innerHTML=`<div class="st bad">✕ ${v} kg 湊不出來</div><div class="near">最接近：${lo?`<button onclick="setW(${lo.t})">↓ ${lo.t}</button>`:''}${hi?`<button onclick="setW(${hi.t})">↑ ${hi.t}</button>`:''}</div>`;return}
 const m=r.p[0];let note='×4 點全相同';
 if(r.m<4){const o=r.p.slice(r.m);note=`另${['','一','兩','三'][o.length]}點：`;}
 $('out').innerHTML=`<div class="st">每一端 ${sum(m)} kg　${r.m==4?'<span style="color:#4caf50">×4 點全相同</span>':`<span style="color:#ffb300">×${r.m} 點</span>`}</div>${svg(m)}<div class="chips">${chips(m)}</div>`+
  (r.m<4?`<div class="note">${note}</div><div class="chips">${chips(r.p[r.m])}</div>`:'')}
function setW(v){W.value=v;render()}
function step(d){let v=parseFloat(W.value)||0;const s=eq==='槓鈴'?1:.5;setW(+(v+d*s).toFixed(2))}
$('mn').onclick=()=>step(-1);$('pl').onclick=()=>step(1);W.oninput=render;
$('bb').onclick=()=>{eq='槓鈴';$('bb').className='on';$('db').className='';setW(42)};
$('db').onclick=()=>{eq='啞鈴';$('db').className='on';$('bb').className='';setW(10.6)};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
