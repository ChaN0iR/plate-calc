<title>槓片計算</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#0d0d0f;color:#fff;font-family:-apple-system,"PingFang TC",sans-serif;height:100dvh;display:flex;flex-direction:column;gap:8px;touch-action:manipulation;
padding:calc(max(var(--sat,env(safe-area-inset-top)),20px) + 10px) calc(env(safe-area-inset-right) + 12px) calc(max(var(--sab,env(safe-area-inset-bottom)),12px) + 10px) calc(env(safe-area-inset-left) + 12px)}
.tog{display:flex;background:#1c1c20;border-radius:14px;padding:3px;flex:none}
.tog button{flex:1;border:0;background:none;color:#aaa;font-size:17px;font-weight:700;padding:10px;border-radius:11px}
.tog button.on{background:#ff7a1a;color:#fff}
.in{display:flex;align-items:center;gap:8px;flex:none}
.in button{width:56px;height:56px;border:0;border-radius:14px;background:#26262b;color:#fff;font-size:30px;font-weight:700}
.in input{flex:1;min-width:0;height:56px;border:2px solid #333;border-radius:14px;background:#16161a;color:#fff;font-size:32px;font-weight:800;text-align:center}
.hint{color:#888;font-size:12px;text-align:center;margin:-2px 0;flex:none}
.card{background:#16161a;border-radius:16px;padding:10px 12px;flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.st{font-size:16px;font-weight:700;margin-bottom:4px;flex:none}.bad{color:#ff5252}
svg{flex:1 1 0;min-height:50px;width:100%;height:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;flex:none}
.chip{padding:3px 9px;border-radius:9px;font-weight:800;font-size:14px}
.tot{margin-top:8px;padding-top:6px;border-top:1px solid #2a2a30;color:#ccc;font-size:15px;font-weight:700;text-align:center;flex:none}
.bld{background:#16161a;border-radius:16px;padding:8px 10px;flex:none}
.bld .lb{color:#888;font-size:12px;margin-bottom:6px}
.pbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:6px}
.pbs button{min-height:44px;border:0;border-radius:11px;background:#2a2a30;color:#eee;font-size:15px;font-weight:800;padding:0}
.pbs button:disabled{opacity:.25}
.pbs button.clr{background:#1f1f24;color:#aaa;border:1px solid #333}
svg rect.pl{cursor:pointer}
.mix{margin-top:6px;border:2px solid #ffb300;border-radius:12px;padding:6px 8px;flex:none;background:#1d1a12}
.mix .h{color:#ffb300;font-size:13px;font-weight:800;margin-bottom:4px}
.mix .row{display:flex;gap:6px}
.mix .pt{flex:1;min-width:0;background:#141416;border-radius:8px;padding:4px}
.mix .pt b{display:block;font-size:12px;color:#ddd;margin-bottom:3px}
.mix .bl{display:flex;flex-wrap:wrap;gap:2px}
.mix .bl i{font-style:normal;font-size:10px;font-weight:800;color:#111;border-radius:3px;padding:1px 3px}
.mix .bar{height:4px;background:#555;border-radius:2px;margin:4px 0}
.note{margin-top:6px;color:#aaa;font-size:13px;line-height:1.3;flex:none}
.near{flex:none}.near button{margin:6px 6px 0 0;border:0;border-radius:11px;background:#26262b;color:#fff;font-size:16px;padding:10px 14px;font-weight:700}
</style></head><body>
<div class="tog"><button id="bb" class="on">🏋️ 槓鈴</button><button id="db">💪 啞鈴</button></div>
<div class="in"><button id="mn">−</button><input id="w" inputmode="decimal" value="42"><button id="pl">＋</button></div>
<div class="hint" id="hint"></div><div class="card" id="out"></div><div class="bld"><div class="lb">手動加片（每點同時加・點圖中槓片移除）</div><div class="pbs" id="pbs"></div></div>
<script src="data.js?v=14"></script><script>
const P=[[1,'#8d6e63','1',.55],[1.25,'#9e9e9e','1.25',.6],[1.5,'#43a047','1.5',.68],[2,'#fdd835','2',.78],[2.5,'#1e88e5','2.5',.86],[5,'#e53935','5',1]];
let eq='槓鈴';const $=id=>document.getElementById(id),W=$('w');
const T=x=>+(2*x).toFixed(2),tot=t=>eq==='啞鈴'?`<div class="tot">兩支合計 ${t} kg</div>`:'';
const rows=()=>ROWS.filter(r=>r.e===eq);
function plates(c){let a=[];for(let i=5;i>=0;i--)for(let k=0;k<c[i];k++)a.push(P[i]);return a}
function svg(c){const a=plates(c);let x=40,s='';const H=150;
 a.forEach(p=>{const w=p[0]>=2.5?30:p[0]>=1.5?24:20,h=H*p[3];
 s+=`<rect class="pl" onclick="rm(${P.indexOf(p)})" x="${x}" y="${(170-h)/2}" width="${w}" height="${h}" rx="4" fill="${p[1]}"/><text x="${x+w/2}" y="${(170-h)/2+h+16}" fill="#ddd" font-size="12" font-weight="700" text-anchor="middle">${p[2]}</text>`;x+=w+3});
 const L=Math.max(x+40,300);
 return `<svg viewBox="0 0 ${L} 190" preserveAspectRatio="xMidYMid meet"><rect x="0" y="72" width="34" height="26" fill="#777"/><rect x="34" y="60" width="6" height="50" fill="#999"/><rect x="40" y="76" width="${L-40}" height="18" rx="3" fill="#bbb"/>${s}</svg>`}
function chips(c){return plates(c).map(p=>`<span class="chip" style="background:${p[1]};color:${p[0]==2?'#000':'#fff'}">${p[2]}</span>`).join('')||'<span class="note">不用掛片（空槓）</span>'}
function sum(c){return c.reduce((s,n,i)=>s+n*P[i][0],0)}
function render(){const _r=render0();if(manual)renderManual();drawPbs();return _r}
function render0(){shown=null;const v=num(W.value);$('hint').textContent=eq==='槓鈴'?'輸入總重（含 12 kg 空槓）':'輸入單支啞鈴重量（含 0.3 kg 握把）';
 if(isNaN(v)){$('out').innerHTML='<div class="st">請輸入重量</div>';return}
 const R=rows(),r=R.find(r=>Math.abs(r.t-v)<0.025);
 if(!r){const lo=R.filter(r=>r.t<v).pop(),hi=R.find(r=>r.t>v);
  $('out').innerHTML=`<div class="st bad">✕ ${v} kg 湊不出來</div><div class="near">最接近：${lo?`<button onclick="setW(${lo.t})">↓ ${lo.t}</button>`:''}${hi?`<button onclick="setW(${hi.t})">↑ ${hi.t}</button>`:''}</div>`+tot([lo&&'↓ '+T(lo.t),hi&&'↑ '+T(hi.t)].filter(Boolean).join(' / '));return}
 const m=r.p[0];if(r.m==4)shown=m.slice();let note='×4 點全相同';
 if(r.m<4){const o=r.p.slice(r.m);note=`另${['','一','兩','三'][o.length]}點：`;}
 $('out').innerHTML=`<div class="st">每一端 ${sum(m)} kg　${r.m==4?'<span style="color:#4caf50">×4 點全相同</span>':`<span style="color:#ffb300">×${r.m} 點</span>`}</div>${svg(m)}<div class="chips">${chips(m)}</div>`+
  (r.m<4?mixPanel(r):'')+tot(T(r.t))}

const INV=[8,4,4,4,4,4];let manual=null,shown=null;
function inv(){return eq==='槓鈴'?INV:[8,4,4,4,4,0]}
function wOf(c){return eq==='槓鈴'?+(12+4*sum(c)).toFixed(2):+(0.3+2*sum(c)).toFixed(2)}
function drawPbs(){const iv=inv(),b=manual||shown||[0,0,0,0,0,0];let h='';
 for(let i=5;i>=0;i--){if(eq!=='槓鈴'&&i==5)continue;h+=`<button onclick="add(${i})" ${4*(b[i]+1)>iv[i]?'disabled':''}>${P[i][2]}</button>`}
 $('pbs').innerHTML=h+'<button class="clr" onclick="clr()">清除</button>'}
function add(i){const b=(manual||shown||[0,0,0,0,0,0]).slice();if(4*(b[i]+1)>inv()[i])return;b[i]++;manual=b;W.value=wOf(b);render()}
function rm(i){const b=(manual||shown||[0,0,0,0,0,0]).slice();if(!b[i])return;b[i]--;manual=b;W.value=wOf(b);render()}
function clr(){manual=[0,0,0,0,0,0];W.value=wOf(manual);render()}
function renderManual(){const m=manual;$('out').innerHTML=`<div class="st">每一端 ${+sum(m).toFixed(2)} kg　<span style="color:#4caf50">×4 點全相同</span></div>${svg(m)}<div class="chips">${chips(m)}</div>`+tot(wOf(m)*2/1&&T(wOf(m)))}
function num(x){const n=parseFloat(String(x).replace(/[，,]/g,'.').replace(/[^0-9.]/g,''));return isNaN(n)?NaN:Math.round(n*20)/20}
function mini(c){const g=['#fff','#e6e6e6','#cfcfcf','#b5b5b5','#9a9a9a','#7d7d7d'];return '<div class="bl">'+(plates(c).map(p=>{const i=P.indexOf(p);return `<i style="background:${g[i]};${i>=4?'color:#fff':''}">${p[2]}</i>`}).join('')||'<i style="background:#333;color:#888">空</i>')+'</div>'}
function mixPanel(r){const A=r.p[0],o=r.p.slice(r.m);let pts;
 if(eq==='槓鈴'){pts=r.m==2?[A,o[0],o[1],A]:[A,...r.p.slice(1)];
  const n=['①','②','③','④'];return `<div class="mix"><div class="h">⚠ 四點配置不同（每點都是 ${+sum(A).toFixed(2)} kg）</div><div class="row">${pts.map((c,i)=>`<div class="pt"><b>${n[i]}${i<2?' 左':' 右'}</b>${mini(c)}</div>`).join('')}</div><div class="bar"></div></div>`}
 const e=r.m==2?[[A,o[0]],[A,o[1]]]:r.m==3?[[A,A],[A,o[0]]]:[[A,o[0]],[o[1],o[2]]];
 return `<div class="mix"><div class="h">⚠ 四端配置不同（每端都是 ${+sum(A).toFixed(2)} kg）</div><div class="row">${e.map((d,k)=>`<div class="pt"><b>啞鈴 ${'AB'[k]}</b><div class="row">${d.map((c,j)=>`<div style="flex:1;min-width:0"><b style="font-size:10px;color:#888">${j?'右':'左'}</b>${mini(c)}</div>`).join('')}</div></div>`).join('')}</div></div>`}
function setW(v){manual=null;W.value=v;render()}
function step(d){let v=num(W.value)||0;const s=eq==='槓鈴'?1:.5;setW(+(v+d*s).toFixed(2))}
$('mn').onclick=()=>step(-1);$('pl').onclick=()=>step(1);W.oninput=()=>{manual=null;render()};
$('bb').onclick=()=>{eq='槓鈴';$('bb').className='on';$('db').className='';setW(42)};
$('db').onclick=()=>{eq='啞鈴';$('db').className='on';$('bb').className='';setW(10.3)};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
